# Mac (Docker Desktop) 側の日常操作を `mise run <task>` にまとめる。一覧は `mise tasks`。
# gw:* / dev:* / relay:* はホスト側専用 (devcontainer の中の Docker には gateway が居ないので、中では拒否する)。
#
#   mise run vscode          # SSH_AUTH_SOCK を渡さずに VS Code を開く (依頼者の鍵を AI に見せない。VS Code は先に完全終了)
#   mise run gw:unlock       # 秘密ストアの解錠。**これが先**。0.2.19 から関所は上流トークンを
#                            # ストアから読むので、施錠中は GitHub API が一切通らない
#   mise run gw:login        # gateway の relay を GitHub に device flow でログイン (初回のみ)
#   mise run gw:check        # relay の状態 (ssh-agent / known_hosts / 上流トークン / 登録鍵)
#   mise run relay:verify    # 一式の受け入れ確認
#   mise run gw -- <args>    # 任意の sekimore-relay サブコマンド
#   mise run gw:recreate     # ゲートウェイを新しいイメージで作り直す (image タグを上げたあと)

[env]
SGW = "{{config_root}}/.devcontainer/scripts/sgw.sh"

# ---- 起動 ----
[tasks.vscode]
description = "VS Code を SSH_AUTH_SOCK が届かない状態で起動する (launchd の変数を外し、open を通さず直接起動、起動後に本体の環境を確認)"
run = 'bash "$MISE_PROJECT_ROOT/.devcontainer/scripts/vscode.sh"'

[tasks."vscode:check"]
description = "launchd / Docker Desktop / 起動中の VS Code の SSH_AUTH_SOCK の状態を表示する"
run = 'bash "$MISE_PROJECT_ROOT/.devcontainer/scripts/vscode.sh" --check'

[tasks."vscode:restore-agent-env"]
description = "launchd に SSH_AUTH_SOCK を戻す (mise run vscode が外したもの。Docker Desktop を再起動する前に実行)"
run = 'bash "$MISE_PROJECT_ROOT/.devcontainer/scripts/vscode.sh" --restore-agent-env'

[tasks.web]
description = "sekimore-gw の Web UI をブラウザで開く"
run = 'open "http://localhost:8080" 2>/dev/null || xdg-open "http://localhost:8080"'

[tasks.ps]
description = "この devcontainer の compose スタックのコンテナ一覧"
run = 'bash "$SGW" ps'

[tasks.down]
description = "compose スタックを停止・削除する (volume は残る。VS Code を閉じた後の後片付け)"
run = 'docker compose -p "$(bash "$SGW" project)" down'

# ---- gateway (sekimore-gw) の relay 操作 ----
[tasks.gw]
description = "gateway で sekimore-relay <args> を実行 (例: mise run gw -- revoke --label skm_xxxxxxxx)"
run = 'bash "$SGW" gw sekimore-relay'

[tasks."gw:login"]
description = "GitHub に device flow でログイン (上流トークンと known_hosts を /data/relay に保存。初回のみ)"
run = 'bash "$SGW" gw sekimore-relay login'

[tasks."gw:logout"]
description = "上流トークンを削除"
run = 'bash "$SGW" gw sekimore-relay logout'

[tasks."gw:whoami"]
description = "gateway がどの GitHub identity として動くか"
run = 'bash "$SGW" gw sekimore-relay whoami'

[tasks."gw:check"]
description = "relay の設定と状態 (ssh-agent / known_hosts / 上流トークン / 登録鍵 / トークン数)"
run = 'bash "$SGW" gw sekimore-relay check'

# ---- 秘密ストア (0.2.15) ----
# パスフレーズはプロンプトでのみ受け取る。引数や環境変数にすると ps に出るため。
# sgw.sh が端末を検出して -it を付けるので、そのまま対話できる。
#
# 0.2.19 から上流 API トークンがここに入る。施錠中は関所が GitHub API を使えない
# (git の push/pull は SSH なので通る)。ゲートウェイを作り直したら必ず解錠する。
[tasks."gw:unlock"]
description = "秘密ストアを解錠する (ゲートウェイ再作成のたびに必須。初回はパスフレーズの設定。解錠しないと GitHub API が通らない)"
# gw-tty: 端末を必ず渡す経路。mise が出力を加工すると stdout がパイプになり、通常の gw は
# docker exec に -t を付けないので、コンテナの中で端末が無くなる
raw = true
run = 'bash "$SGW" gw-tty sekimore-relay unlock'

[tasks."gw:lock"]
description = "秘密ストアの鍵を忘れる (次の解錠まで GitHub API も止まる。0.2.19 からトークンのキャッシュも同時に落ちる)"
run = 'bash "$SGW" gw sekimore-relay lock'

[tasks."gw:store-status"]
description = "秘密ストアが解錠済みか、施錠中か、未初期化かを表示する"
run = 'bash "$SGW" gw sekimore-relay store-status'

[tasks."gw:passphrase"]
description = "秘密ストアのパスフレーズを変更する (--kdf pbkdf2-sha256 で KDF も切り替えられる)"
raw = true
run = 'bash "$SGW" gw-tty sekimore-relay passphrase'
# export は施錠中でも取れる (鍵が要らない)。封じてあるが、守っているのはパスフレーズだけ。
# raw: JSON を標準出力にそのまま流す。mise が出力に接頭辞を付けると壊れる
[tasks."gw:store-export"]
description = "秘密ストアを封じたまま書き出す: mise run gw:store-export > store.json"
raw = true
run = 'bash "$SGW" gw sekimore-relay store-export'

[tasks."gw:store-import"]
description = "空の秘密ストアを envelope で置き換える: mise run gw:store-import < store.json"
raw = true
run = 'bash "$SGW" gw sekimore-relay store-import'

[tasks."gw:reload-status"]
description = "config.yml の保存が反映される状態か (gw 0.2.13〜)。AI に作業を渡す前に確認する"
run = 'bash "$SGW" gw python -m src.maint reload-status'

[tasks."gw:reload-follow"]
description = "反映の窓を開ける (既定 30m): mise run gw:reload-follow -- 1h。config.yml を詰めている間だけ"
run = 'bash "$SGW" gw python -m src.maint reload-follow'

[tasks."gw:reload-freeze"]
description = "反映の窓を今すぐ閉じる。config.yml は dev から書けるので、AI に渡す前にこれを打つ"
run = 'bash "$SGW" gw python -m src.maint reload-freeze'

[tasks."gw:tokens"]
description = "発行済み案件トークンの一覧 (ラベル / 期限 / 使用回数 / 状態)"
run = 'bash "$SGW" gw sekimore-relay tokens'

[tasks."gw:revoke-project"]
description = "案件の全トークンを失効 (案件終了時)"
run = 'bash "$SGW" gw sekimore-relay revoke-project'

[tasks."gw:bootstrap"]
description = "自動登録の kill-switch: mise run gw:bootstrap -- disable|enable|status"
run = 'bash "$SGW" gw sekimore-relay bootstrap'

[tasks."gw:db-stats"]
description = "gateway のログ DB (DNS / firewall / proxy) の件数・期間・サイズ・索引 (gw 0.2.3〜)"
run = 'bash "$SGW" gw python -m src.maint db-stats'

[tasks."gw:db-prune"]
description = "N 日より古いログを削除 (記録は既定で残すので明示的に): mise run gw:db-prune -- --before-days 90 --yes [--vacuum]"
run = 'bash "$SGW" gw python -m src.maint db-prune'

[tasks."gw:db-reset"]
description = "ログ DB を空にして VACUUM (relay の監査は別ファイル): mise run gw:db-reset -- --yes"
run = 'bash "$SGW" gw python -m src.maint db-reset'

[tasks."gw:audit"]
description = "relay の監査ログを追う (全ての拒否と操作。Ctrl-C で終了)"
run = 'bash "$SGW" gw tail -n 50 -f /data/relay/audit.jsonl'

[tasks."gw:logs"]
description = "gateway のコンテナログを追う"
run = 'docker logs -f --tail 100 "$(bash "$SGW" id sekimore-gw)"'

[tasks."gw:restart"]
description = "gateway を再起動 (config.yml の domain_handlers / relay を変えたあと。dev は動いたまま)"
run = 'docker restart "$(bash "$SGW" id sekimore-gw)"'

[tasks."gw:recreate"]
description = "gateway を最新イメージで pull して作り直す (compose の image タグを上げたあと。docker restart では入れ替わらない)"
run = 'bash "$SGW" recreate'

[tasks."gw:shell"]
description = "gateway のシェル (root)"
run = 'bash "$SGW" gw bash'

# ---- dev (AI のサンドボックス) ----
[tasks."dev:shell"]
description = "dev コンテナのシェル (vscode ユーザー)"
run = 'bash "$SGW" dev zsh'

[tasks."dev:agent-setup"]
description = "dev で agent-setup を再実行 (relay への鍵登録・トークン・known_hosts を作り直す。冪等)"
run = 'bash "$SGW" dev sudo /usr/local/bin/sekimore-agent-setup.sh'

[tasks."dev:signing-key"]
description = "AI の署名用公開鍵を表示 (GitHub の Settings → SSH and GPG keys に Signing Key として登録する)"
run = 'bash "$SGW" dev cat /home/vscode/.ssh/sekimore/signing_ed25519.pub'

# ---- 受け入れ確認 ----
[tasks."relay:verify"]
description = "relay の受け入れ確認: gateway の状態 / dev に依頼者の agent が届いていないこと / dev から関所経由の git"
run = '''
set -u
fail=0
echo "== gateway: sekimore-relay check"
bash "$SGW" gw sekimore-relay check | sed -n '/^state:/,$p'
echo
echo "== dev: the operator's ssh-agent must NOT be reachable"
if bash "$SGW" dev ssh-add -l >/dev/null 2>&1; then
  echo "❌ FAIL: ssh-add -l succeeded inside dev — the operator's keys are exposed to the AI. Reopen with: mise run vscode"
  fail=1
else
  echo "OK: no ssh-agent in dev"
fi
echo
echo "== dev: relay token (sekimore whoami)"
bash "$SGW" dev sekimore whoami || fail=1
echo
echo "== dev: git ls-remote through the relay (first repo of the project)"
bash "$SGW" dev sh -c '. /etc/sekimore-agent/env && git ls-remote "git@$SEKIMORE_GIT_DOMAIN:$SEKIMORE_REPO.git" HEAD' || fail=1
echo "== dev: a repository outside the project must be denied"
if bash "$SGW" dev sh -c '. /etc/sekimore-agent/env && git ls-remote "git@$SEKIMORE_GIT_DOMAIN:sekimore-test/not-in-project.git" HEAD' 2>&1 | grep -q "not in project"; then
  echo "OK: denied"
else
  echo "❌ FAIL: no 'not in project' denial"; fail=1
fi
echo
[ "$fail" -eq 0 ] && echo "relay:verify: all checks passed" || { echo "relay:verify: FAILED"; exit 1; }
'''
