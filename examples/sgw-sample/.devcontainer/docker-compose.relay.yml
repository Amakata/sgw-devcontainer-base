# sekimore-relay overlay (git / GitHub API 中継関所。sekimore-gw 0.1.2 以降に同梱)。
#
# devcontainer.json の dockerComposeFile で docker-compose.yml の後に並べる。
# relay を使わない場合はそこから外し、config/config.yml の domain_handlers: / relay: を消す。
#
# 何をするか:
#   * sekimore-gw に依頼者の ssh-agent を渡す (relay は上流 git にこの agent で認証する。鍵は Mac から出ない)。
#       - Docker Desktop (Mac): Docker Desktop がホストの agent を VM 内の固定パス
#         /run/host-services/ssh-auth.sock に転送している。これが既定。
#         Mac 側で `ssh-add -l` に鍵が出ていること (無ければ `ssh-add --apple-use-keychain ~/.ssh/<key>`)。
#       - Vagrant VM: 固定パスに socket を用意して SEKIMORE_AGENT_SOCK に書く
#         (例: Mac から `ssh -N -o StreamLocalBindUnlink=yes -R /home/vagrant/.ssh-agent/agent.sock:$SSH_AUTH_SOCK <vm>`、
#          SEKIMORE_AGENT_SOCK=/home/vagrant/.ssh-agent/agent.sock)。転送を張り直すと socket の inode が変わり
#          マウントが古くなるので `docker compose up -d --force-recreate sekimore-gw` が必要。
#   * dev の使い捨て鍵 (~/.ssh/sekimore) を volume にして再ビルドでも変わらないようにする。
#   * 署名鍵の socket を gateway と dev で共有する (sekimore-gw 0.2.29 以降、#59)。
#       - config.yml に relay.signing_key を書くと、gateway がホストの ssh-agent の「1 本だけ」を
#         絞り込んだ agent socket を /run/sekimore/signing-agent.sock に作る。dev はそこを
#         SSH_AUTH_SOCK にして `git commit` するだけ。秘密鍵は dev に入らない。
#       - この socket は git 署名 (SSHSIG, namespace=git) 以外を一切通さないので、認証には使えない。
#         依頼者の他の鍵は同じ agent にあっても fingerprint で隠れる。
#       - relay.signing_key を書かない場合、この volume は使われない (dev が従来どおり鍵を生成する)。
#
# 前提: 依頼者の agent が dev に転送されていないこと (dev 内で `ssh-add -l` が失敗すること)。
# Dev Containers 拡張の暗黙転送の止め方は doc/sgw-devcontainer-base/design/sekimore-relay-agent.md D-6。
services:
  sekimore-gw:
    volumes:
      - ${SEKIMORE_AGENT_SOCK:-/run/host-services/ssh-auth.sock}:/ssh-agent/agent.sock:ro
      # 署名 socket を置く volume (relay.signing_key を書いたときだけ使われる)
      - sekimore-signing:/run/sekimore
    environment:
      - SSH_AUTH_SOCK=/ssh-agent/agent.sock

  dev:
    volumes:
      - sekimore-agent-keys:/home/vscode/.ssh/sekimore
      # 同じ volume。read-write なのは unix socket への connect(2) に書き込み権限が要るため。
      # socket 自体は 0600 で relay.signing_key.socket_uid (既定 1000 = vscode) の所有。
      - sekimore-signing:/run/sekimore
    environment:
      # sekimore-agent-setup.sh が読む (auto: 鍵登録とトークン取得を自動化 / manual: 操作者が add-key と token を行う)
      - SEKIMORE_BOOTSTRAP=${SEKIMORE_BOOTSTRAP:-auto}
      # 1 なら post-create の agent 転送検知を ERROR ではなく警告にする (非推奨。.env で設定)
      - SEKIMORE_ALLOW_AGENT_FORWARD=${SEKIMORE_ALLOW_AGENT_FORWARD:-0}
      # 1 なら HTTPS git の credential helper (依頼者の GitHub 認証をホストから借りる経路) を残す (非推奨)
      - SEKIMORE_ALLOW_CREDENTIAL_HELPER=${SEKIMORE_ALLOW_CREDENTIAL_HELPER:-0}
      # 署名鍵のコメント (GitHub に Signing Key として登録するときの Title)。既定は "sekimore-agent-signing: <案件名> / <git user.name> <user.email>"
      - SEKIMORE_PROJECT=${SEKIMORE_PROJECT:-sgw-sample}
      - SEKIMORE_SIGNING_KEY_COMMENT=${SEKIMORE_SIGNING_KEY_COMMENT:-}

volumes:
  sekimore-agent-keys:
    name: sekimore-agent-keys-${DEVCONTAINER_ID}
  sekimore-signing:
    name: sekimore-signing-${DEVCONTAINER_ID}
