# Sekimore Gateway - AI Agent Security Gateway
# Sample Configuration for sgw-sample

name: SGW Example | Sekimore
description: SGW Example

# Allowed Domain List
# Wildcard notation: ".example.com" allows "*.example.com", "*.*.example.com", etc.
allow_domains:
  # AI
  - storage.googleapis.com
  - platform.claude.com
  - api.anthropic.com
  # debian
  - deb.debian.org
  # github
  - github.com
  - api.github.com
  - raw.githubusercontent.com
  - release-assets.githubusercontent.com
  # vscode
  - main.vscode-cdn.net
  - www.vscode-unpkg.net
  - marketplace.visualstudio.com
  - packages.microsoft.com
  # docker
  - registry-1.docker.io
  - auth.docker.io
  - docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com
  - production.cloudflare.docker.com
  # python
  - www.python.org
  - pypi.org
  - .pythonhosted.org
  # nodejs
  - npmjs.com
  - nodejs.org
  - .npmjs.org
  # docker compose service names
  - sekimore-gw
  - dev

# Ignored Domain List (hidden from UI dashboard, but DNS resolves normally)
ignore_domains: []

# Blocked Domain List
block_domains: []

# Allowed IP List (direct access)
# ⚠️  Do NOT include external DNS servers (e.g., 8.8.8.8).
allow_ips: []

# Blocked IP List
block_ips: []

# Proxy Configuration
proxy:
  enabled: false
  port: 3128
  cache_enabled: true
  cache_size_mb: 1000
  upstream_proxy: proxy.example.com:3128
  upstream_proxy_username: null
  upstream_proxy_password: null

# Web UI の言語 (gw 0.2.4〜)。auto = ブラウザの Accept-Language (画面で切り替えれば cookie が優先)。en / ja で固定
# CLI は環境変数を見る: SEKIMORE_LANG / LC_ALL / LC_MESSAGES / LANG (既定は英語)
# ui:
#   language: auto

# Network Configuration
network:
  lan_subnets: []

# Database Path
database_path: "/data/security_gateway.db"

# ---- sekimore-relay: git / GitHub API relay (docker-compose.relay.yml) ----
# `git@github.com:Org/Repo.git` from dev is answered by the relay inside sekimore-gw
# (DNS points github.com at the gateway), checked against this project policy and
# forwarded upstream with the operator's ssh-agent. Remove this block (and the overlay
# from devcontainer.json) to run without the relay.
domain_handlers:
  github.com:
    handler: github          # exact FQDN. More upstreams (e.g. GHES) need their own ssh_port (gw 0.2.0+)
relay:
  https: passthrough            # HTTPS to github.com is forwarded unchanged (reject = drop with a log line)
  bootstrap: auto               # dev registers its disposable key and gets a project token automatically
  token_ttl: 12h
  project:
    name: sgw-sample
    repos:
      # Fill in the repositories this project may touch. Everything else is denied.
      - name: Amakata/sgw-devcontainer-base
        mode: read-write        # read-only | read-write
        bases: [main]           # branches a PR may target (push HEAD:refs/for/main)
    permissions:
      - pr:create
      - issue:create
      - issue:comment
      # - release:create      # sekimore release create (gw 0.2.6+; push the tag first)
      # - release:read
      # - pr:request_review   # sekimore pr request-review (gw 0.2.7+)
    # boards:                 # gw 0.2.7+: required before any project:* call. Written as the URL reads
    #   - { org: acme, number: 3 }      # github.com/orgs/acme/projects/3
