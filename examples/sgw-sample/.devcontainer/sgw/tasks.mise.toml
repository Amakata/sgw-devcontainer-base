# The host-side tasks, included from mise.toml. `mise tasks` lists them.
# Host-side only: the Docker inside the devcontainer has no gateway, so they refuse to run in there.
#
# Distributed by sgw-devcontainer-base: `mise run upgrade:apply` replaces this file, and stops
# rather than overwrite it once it has been edited. To change a task, define one with the same
# name in mise.toml — mise prefers it over this file.
#
# The order is the part worth remembering:
#
#   mise run vscode          # open VS Code without SSH_AUTH_SOCK (the operator's keys stay away from the AI)
#   mise run gw:unlock       # unlock the secret store. **This comes first**; locked, the GitHub API does not work
#   mise run gw:login        # first time only. It cannot run before the unlock
#   mise run relay:verify    # the acceptance check for the whole set
#   mise run upgrade         # is anything newer? (changes nothing)

# ---- Starting up ----
[vscode]
description = "start VS Code where SSH_AUTH_SOCK does not reach it (unset the launchd variable, start the app directly rather than through open, and check the app's environment afterwards)"
# raw: when the gateway is already up it offers to unlock the secret store, which needs a terminal
raw = true
run = 'bash "$(dirname "$SGW")/vscode.sh"'

["vscode:check"]
description = "show the state of SSH_AUTH_SOCK in launchd, in Docker Desktop and in the running VS Code"
run = 'bash "$(dirname "$SGW")/vscode.sh" --check'

["vscode:restore-agent-env"]
description = "put SSH_AUTH_SOCK back into launchd (the one mise run vscode removed). Run it before restarting Docker Desktop"
run = 'bash "$(dirname "$SGW")/vscode.sh" --restore-agent-env'

[web]
description = "open sekimore-gw's web UI in a browser"
# The port comes from the running container. A number written here drifts from the compose file
# as soon as a project moves the published port (8090 taken, so 8091).
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=$(bash "$SGW" port sekimore-gw 8080)
url="http://localhost:$port"
echo "$url"
open "$url" 2>/dev/null || xdg-open "$url"
'''

[ps]
description = "the containers of this devcontainer's compose stack"
run = 'bash "$SGW" ps'

[down]
description = "stop and remove the compose stack (the volumes stay). The tidy-up after closing VS Code"
run = 'docker compose -p "$(bash "$SGW" project)" down'

# ---- Upgrading ----
[upgrade]
description = "compare the pinned gateway and base with the newest, and say what an upgrade would change (changes nothing)"
run = 'bash "$(dirname "$SGW")/upgrade.sh"'

["upgrade:apply"]
description = "upgrade to the newest: rewrite the tags, replace .devcontainer/sgw/, recreate the gateway after asking, unlock"
# raw: it asks before recreating the gateway, and the unlock may prompt for the passphrase
raw = true
run = 'bash "$(dirname "$SGW")/upgrade.sh" --apply'

["upgrade:sync"]
description = "bring .devcontainer/sgw/ in line with the versions already pinned (after changing a tag by hand, or the language)"
run = 'bash "$(dirname "$SGW")/upgrade.sh" --sync'

["upgrade:notes"]
description = "print the UPGRADING sections between the pinned versions and the newest"
run = 'bash "$(dirname "$SGW")/upgrade.sh" --notes'

# ---- dev (the AI's sandbox) ----
["dev:shell"]
description = "a shell in the dev container (as the vscode user)"
# raw: an interactive shell needs the terminal; without it mise's prefix output mode makes stdout a
# pipe, sgw.sh drops -t, and zsh sits there without a prompt
raw = true
run = 'bash "$SGW" dev zsh'

["dev:agent-setup"]
description = "run agent-setup again in dev (registers the key with the relay and remakes the token and known_hosts; idempotent)"
run = 'bash "$SGW" dev sudo /usr/local/bin/sekimore-agent-setup.sh'

["dev:signing-key"]
description = "print the AI's signing public key (register it on GitHub under Settings -> SSH and GPG keys as a Signing Key)"
run = 'bash "$SGW" dev cat /home/vscode/.ssh/sekimore/signing_ed25519.pub'

# ---- The acceptance check ----
["relay:verify"]
description = "the relay's acceptance check: the gateway's state, that the operator's agent does not reach dev, and git, HTTPS and one GitHub API call through the relay from dev"
run = '''
set -u
fail=0
# colors only on a terminal; NO_COLOR wins; SEKIMORE_COLOR=always|never forces
if [ "${SEKIMORE_COLOR:-auto}" = always ] || { [ "${SEKIMORE_COLOR:-auto}" = auto ] && [ -z "${NO_COLOR+x}" ] && [ -t 1 ]; }; then
  c_ok=$'\e[32m'; c_bad=$'\e[31m'; c_off=$'\e[0m'
else
  c_ok=; c_bad=; c_off=
fi
ok()   { printf '%sOK:%s %s\n' "$c_ok" "$c_off" "$*"; }
fail() { printf '%s❌ FAIL:%s %s\n' "$c_bad" "$c_off" "$*"; fail=1; }
echo "== gateway: sekimore-relay check"
# kept whole: the 443 target: lines pick the domain the HTTPS probe below goes to
gwcheck=$(bash "$SGW" gw sekimore-relay check || true)
printf '%s\n' "$gwcheck" | sed -n '/^state:/,$p'
echo
echo "== dev: only the gateway's filtered signing key may be reachable"
n=$(bash "$SGW" dev sh -c 'set -a; . /etc/sekimore-agent/env 2>/dev/null; set +a; ssh-add -l 2>/dev/null' | grep -c . || true)
if [ "$n" = 1 ]; then
  ok "exactly one key (the signing key, via the gateway's filtered agent)"
elif [ "$n" = 0 ]; then
  ok "no ssh-agent in dev"
else
  fail "ssh-add -l lists $n keys inside dev — the operator's keys are exposed to the AI. Reopen with: mise run vscode"
fi
echo
echo "== dev: git signs with the key it is meant to"
# The Dev Containers extension copies the host's user.signingkey over the container's on every
# start; from gateway 0.2.31 agent-setup's own setting wins. An inline key:: value, or a key the
# signing socket does not offer, makes every commit fail with "Couldn't find key in agent".
sig=$(bash "$SGW" dev sh -c 'set -a; . /etc/sekimore-agent/env 2>/dev/null; set +a
  [ "$(git config --get commit.gpgsign 2>/dev/null)" = true ] || { echo off; exit; }
  k=$(git config --get user.signingkey 2>/dev/null)
  case $k in "") echo "unset"; exit ;; key::*) echo inline; exit ;; esac
  [ -f "$k" ] || { echo "missing: $k"; exit; }
  if [ -n "${SEKIMORE_SIGNING_SOCK:-}" ]; then
    pub=$(cut -d" " -f1,2 "$k")
    if SSH_AUTH_SOCK=$SEKIMORE_SIGNING_SOCK ssh-add -L 2>/dev/null | cut -d" " -f1,2 | grep -qxF "$pub"; then echo ok; else echo "not offered by the signing socket: $k"; fi
  else
    echo ok
  fi' 2>/dev/null || echo "dev unavailable")
case "$sig" in
  ok) ok "user.signingkey is the key the gateway signs with" ;;
  off) echo "note: commit signing is off in dev" ;;
  inline)
    fail "user.signingkey is an inline key:: value — the host's, copied in by the Dev Containers extension. Recreate with gateway 0.2.31 or later"
    ;;
  *) fail "user.signingkey — $sig" ;;
esac
echo
echo "== .env: the setup script's variables must survive sudo"
# sudo resets the environment. post-start.sh passes every SEKIMORE_* variable through it; the older
# postStartCommand named them in --preserve-env=, and one missing from that list is set and then
# silently ignored. What the gateway and post-create.sh read does not go through sudo.
if grep -q '\.devcontainer/sgw/post-start\.sh' .devcontainer/devcontainer.json 2>/dev/null; then
  ok "postStartCommand runs .devcontainer/sgw/post-start.sh, which passes every SEKIMORE_* variable"
else
plist=,$(sed -n 's/.*--preserve-env=\([A-Za-z0-9_,]*\).*/\1/p' .devcontainer/devcontainer.json | head -1),
others=",SEKIMORE_AGENT_SOCK,SEKIMORE_ALLOW_AGENT_FORWARD,SEKIMORE_ALLOW_CREDENTIAL_HELPER,SEKIMORE_SECRET_ENV,"
dropped=
for v in $(sed -n 's/^ *\(SEKIMORE_[A-Z_]*\)=.*/\1/p' .devcontainer/.env 2>/dev/null); do
  case "$others" in *",$v,"*) continue ;; esac
  case "$plist" in *",$v,"*) ;; *) dropped="$dropped $v" ;; esac
done
if [ -n "$dropped" ]; then
  fail "${dropped# } is set in .env but missing from --preserve-env= in devcontainer.json postStartCommand. Run .devcontainer/sgw/post-start.sh from it instead (mise run upgrade says how)"
else
  ok "every setup-script variable in .env survives sudo"
fi
fi
echo
echo "== gateway: the secret store"
# 0.2.19: the upstream API token lives in the store, so a locked one is not a note —
# the relay cannot reach the GitHub API at all until someone unlocks it.
state=$(bash "$SGW" gw sekimore-relay store-status 2>/dev/null || echo unavailable)
case "$state" in
  unlocked) ok "unlocked" ;;
  "not initialised") echo "note: no store yet. mise run gw:unlock sets the passphrase" ;;
  *)
    fail "the store is $state, so the relay cannot read the upstream API token. Run: mise run gw:unlock"
    ;;
esac
echo
echo "== dev: relay token (sekimore whoami)"
# kept whole: the permissions line picks the GitHub API call the probe below makes
who=$(bash "$SGW" dev sekimore whoami 2>&1) || fail=1
printf '%s\n' "$who"
echo
echo "== dev: git ls-remote through the relay (first repo of the project)"
bash "$SGW" dev sh -c '. /etc/sekimore-agent/env && git ls-remote "git@$SEKIMORE_GIT_DOMAIN:$SEKIMORE_REPO.git" HEAD' || fail=1
echo "== dev: a repository outside the project must be denied"
if bash "$SGW" dev sh -c '. /etc/sekimore-agent/env && git ls-remote "git@$SEKIMORE_GIT_DOMAIN:sekimore-test/not-in-project.git" HEAD' 2>&1 | grep -q "not in project"; then
  ok "denied"
else
  fail "no 'not in project' denial"
fi
echo
echo "== dev: HTTPS to a relayed domain must reach the upstream (through the upstream proxy when one is configured)"
# git through the relay is SSH and never touches the upstream proxy, so it stays green while every
# HTTPS path through the relay is dead (sgw-devcontainer-base#85). This goes the way the API does.
hint="the relay cut the connection — mise run gw:logs for 'TLS to the proxy failed' or 'https_failed', then mise run gw:check (reach:)"
targets=$(printf '%s\n' "$gwcheck" | sed -n 's/^ *443 target: *\([^ ]*\).*/\1/p')
target=$(printf '%s\n' "$targets" | grep -x api.github.com | head -1)
[ -n "$target" ] || target=$(printf '%s\n' "$targets" | grep -v '^$' | head -1)
if [ -z "$target" ]; then
  echo "SKIP: no 443 target configured"
else
  # the exit code is curl's own, kept apart from the status code it writes to stdout
  code=$(bash "$SGW" dev curl -sS -m 10 -o /dev/null -w '%{http_code}' "https://$target/" 2>/dev/null); rc=$?
  if [ "$rc" -eq 0 ] && [ -n "$code" ]; then
    ok "https://$target/ answered HTTP $code (any status means the upstream was reached)"
  else
    fail "https://$target/ — curl exit $rc. $hint"
  fi
fi
echo
echo "== dev: one GitHub API call through the relay"
# sekimore whoami answers out of the gateway's own state and calls no GitHub API; this one does.
perms=$(printf '%s\n' "$who" | sed -n 's/^permissions[^:]*: *//p' | head -1)
case " $perms " in
  *" pr:read "*) probe="pr list --limit 1" ;;
  *" issue:read "*) probe="issue list --limit 1" ;;
  *" repo:read "*) probe="repo vocabulary" ;;
  *) probe= ;;
esac
if [ -z "$probe" ]; then
  echo "SKIP: the project grants no read permission to probe with"
else
  err=$(bash "$SGW" dev sekimore $probe 2>&1 >/dev/null); rc=$?
  if [ "$rc" -eq 0 ]; then
    ok "sekimore $probe answered"
  else
    last=$(printf '%s\n' "$err" | grep -v '^$' | tail -1)
    fail "sekimore $probe — exit $rc: $last. $hint"
  fi
fi
echo
echo "== dev: a root process must not route past the gateway (host-side FORWARD rules, gateway 0.2.37)"
# The bridge's .1 is Docker's own router. Without the gateway's rules in the host's DOCKER-USER
# chain, a host route through it reaches the internet by Docker's NAT, around every filter.
# The address is read from the JSON: mise would take a Go template's braces for its own.
bridge_gw=$(docker network inspect "$(bash "$SGW" project 2>/dev/null)_internal-net" 2>/dev/null |
  sed -n 's/.*"Gateway": *"\([0-9.]*\)".*/\1/p' | head -1)
if [ -z "$bridge_gw" ]; then
  fail "could not find the internal bridge's gateway address"
else
  # one shell in dev, so the route goes away with it whatever curl does
  bypass=$(bash "$SGW" dev sh -c '
    sudo ip route replace 1.1.1.1/32 via "$1" 2>/dev/null || { echo noroute; exit 0; }
    trap "sudo ip route del 1.1.1.1/32 2>/dev/null" EXIT
    if curl --noproxy "*" -m 5 -sS -o /dev/null http://1.1.1.1/ 2>/dev/null; then echo reached; else echo blocked; fi' sh "$bridge_gw" 2>/dev/null || echo "dev unavailable")
  case "$bypass" in
    blocked) ok "blocked (a host route via $bridge_gw leads nowhere)" ;;
    reached)
      fail "dev reached 1.1.1.1 via $bridge_gw, around the gateway. Add pid: host to the sekimore-gw service, then run: mise run gw:recreate"
      ;;
    noroute) fail "could not add the test route in dev (sudo ip route)" ;;
    *) fail "$bypass" ;;
  esac
fi
echo
echo "== dev: the host itself must not answer dev (host-side INPUT rules, gateway 0.2.38)"
# The same .1 is the host's own address on the bridge. Two INPUT rules keep it silent: replies to
# connections the host opened are accepted, everything else from the bridge is dropped. Without
# them dev reaches the host, every port a container on the machine publishes, and the VM's services.
if [ -n "$bridge_gw" ]; then
  if bash "$SGW" dev ping -c1 -W2 "$bridge_gw" >/dev/null 2>&1; then
    fail "dev reached the host at $bridge_gw. Gateway 0.2.38 or later drops this; run: mise run gw:recreate"
  else
    ok "no answer from $bridge_gw"
  fi
fi
echo
[ "$fail" -eq 0 ] && printf '%srelay:verify: all checks passed%s\n' "$c_ok" "$c_off" ||
  { printf '%srelay:verify: FAILED%s\n' "$c_bad" "$c_off"; exit 1; }
'''
